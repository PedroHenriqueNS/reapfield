name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      # The interpreter comes from setup-python, NOT `uv python install`.
      # uv's managed CPython 3.13.12 build breaks `cryptography`, which `mcp`
      # imports at load. uv manages dependencies only.
      - uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}

      # astral-sh publishes no floating `v9` tag (only exact patch tags), so this
      # is pinned exact — don't "helpfully" shorten it back to @v9.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # Point uv at the interpreter setup-python installed. Passing a bare
      # version string here would let uv download its OWN build, which is the
      # exact thing this job avoids.
      - name: Install dependencies
        run: uv sync --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Confirm the interpreter is the one setup-python provided
        run: uv run python -c "import sys; print(sys.executable, sys.version)"

      # No Playwright: the suite is offline by construction and never opens a browser.
      - name: Run tests
        run: uv run pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync
      - name: Ruff
        run: uv run ruff check .
      # `reduce.py` has exactly 2 known false positives from selectolax's type
      # stubs (they declare `node.tag` as `str | None` when it's never None in
      # practice -- see CONTRIBUTING.md). pyright can't be told to ignore just
      # those two, so this asserts the error *count* instead of masking every
      # failure with `|| true`: a third error (anywhere) fails the build, while
      # the two tolerated ones stay invisible to the exit code.
      - name: "Pyright (baseline: 2 known reduce.py false positives)"
        run: |
          uv run pyright --outputjson reapfield > pyright.json || true
          python3 -c "
          import json, sys
          data = json.load(open('pyright.json'))
          count = data['summary']['errorCount']
          print(f'pyright error count: {count} (expected 2)')
          if count != 2:
              for d in data['diagnostics']:
                  if d['severity'] == 'error':
                      line = d['range']['start']['line'] + 1
                      print(f\"{d['file']}:{line}: {d['message']}\")
              sys.exit(1)
          "
