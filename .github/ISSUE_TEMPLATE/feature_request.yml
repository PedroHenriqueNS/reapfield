name: Feature request
description: Suggest an idea for reapfield
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Note: anti-bot evasion (bypassing CAPTCHAs, rate limits, or bot detection) is
        permanently out of scope. See [CONTRIBUTING.md](../../CONTRIBUTING.md) before proposing it.
