[project]
name = "reapfield"
version = "0.1.0"
description = "Scrape a URL into structured JSON from a natural-language field spec"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "mcp>=1.2",
    "playwright>=1.49",
    "pydantic>=2.9",
    "selectolax>=0.3.21",
]

[project.scripts]
reapfield = "reapfield.cli:main"
reapfield-mcp = "reapfield.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reapfield"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
