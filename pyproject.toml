[project]
name = "reapfield"
version = "0.1.0"
description = "Scrape a URL into structured JSON from a natural-language field spec"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pedro Henrique", email = "106723520+PedroHenriqueNS@users.noreply.github.com" },
]
keywords = ["scraping", "scraper", "web-scraping", "cli", "mcp", "llm", "html", "json"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "mcp>=1.2",
    "playwright>=1.49",
    "pydantic>=2.9",
    "selectolax>=0.3.21",
]

[project.urls]
Homepage = "https://github.com/PedroHenriqueNS/reapfield"
Repository = "https://github.com/PedroHenriqueNS/reapfield"
Issues = "https://github.com/PedroHenriqueNS/reapfield/issues"
Changelog = "https://github.com/PedroHenriqueNS/reapfield/blob/main/CHANGELOG.md"

[project.scripts]
reapfield = "reapfield.cli:main"
reapfield-mcp = "reapfield.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reapfield"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
